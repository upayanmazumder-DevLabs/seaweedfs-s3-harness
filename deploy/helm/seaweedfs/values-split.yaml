# Example values for the official SeaweedFS Helm chart
# (https://seaweedfs.github.io/seaweedfs/helm, pinned at 4.48.0), deploying
# a conservative split master/volume/filer/s3-gateway topology suitable for
# a small single-node Kubernetes cluster.
#
#   helm repo add seaweedfs https://seaweedfs.github.io/seaweedfs/helm
#   helm install seaweedfs-it seaweedfs/seaweedfs \
#     --version 4.48.0 -n <namespace> -f values-split.yaml \
#     --set-string s3.existingConfigSecret=<your-secret-name>
#
# The S3 identities secret is intentionally NOT generated by the chart
# (its auto-generated secret uses Helm's `lookup` and can rotate on a
# GitOps resync). Create it yourself, e.g. with scripts/gen-secrets.sh,
# then pass its name via s3.existingConfigSecret above, or set it in a
# second values file / --set that you do not commit.

global:
  seaweedfs:
    # The chart defaults this to true; this harness needs no
    # cluster-scoped RBAC and a namespace-scoped Role is sufficient.
    createClusterRole: false
    enableSecurity: false

master:
  enabled: true
  replicas: 1
  data:
    type: persistentVolumeClaim
    size: 1Gi
    storageClass: "" # use the cluster default StorageClass
  logs:
    type: emptyDir
  # Each S3 bucket is its own SeaweedFS collection; the chart default
  # (1000MB) and the binary default (30000MB) both pre-allocate far more
  # volume capacity than a small test cluster has disk for.
  volumeSizeLimitMB: 256
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

volume:
  enabled: true
  replicas: 1
  index: leveldb
  dataDirs:
    - name: data1
      type: persistentVolumeClaim
      size: 10Gi
      storageClass: ""
      maxVolumes: 40
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

filer:
  enabled: true
  data:
    type: persistentVolumeClaim
    size: 2Gi
    storageClass: ""
  logs:
    type: emptyDir
  s3:
    enabled: false # standalone s3 gateway below, not the embedded filer one
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

s3:
  enabled: true
  replicas: 1
  enableAuth: true
  # existingConfigSecret: set via --set-string at install time; see the
  # comment at the top of this file. Do not hardcode a secret name with a
  # real credential payload into a committed values file.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# Everything else (allInOne, sftp, admin, worker, cosi, monitoring) stays
# at the chart's disabled defaults - this harness does not use them.
